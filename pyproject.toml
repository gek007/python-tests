[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "asyncio>=4.0.0",
    "dataclasses>=0.8",
    "fastapi>=0.135.1",
    "fastmcp>=2.0.0",
    "fastapi-users[sqlalchemy]>=15.0.4",
    "gradio>=6.13.0",
    "imagekitio>=5.2.0",
    "ipykernel>=7.2.0",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.1",
    "langchain-openai>=1.2.0",
    "langgraph>=1.1.9",
    "openai-agents>=0.17.5",
    "pathlib>=1.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "shared>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.42.0",
]

[tool.hatch.build.targets.wheel]
packages = ["my_package"]

[tool.ruff.lint]
unfixable = ["F401"]
