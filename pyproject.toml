[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncio>=4.0.0",
    "dataclasses>=0.8",
    "fastapi>=0.135.1",
    "fastapi-users[sqlalchemy]>=15.0.4",
    "imagekitio>=5.2.0",
    "ipykernel>=7.2.0",
    "langchain-core>=1.3.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.42.0",
]

[tool.hatch.build.targets.wheel]
packages = ["my_package"]

[tool.ruff.lint]
unfixable = ["F401"]
